name: Build and Release Jar

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4.4.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Give Gradlew execute permission
        run: chmod +x ./gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4.0.2
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Extract version from build.gradle.kts
        id: get_version
        run: |
          VERSION=$(grep "^version =" build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Get last commit message for changelog
        id: get_commit_message
        run: |
          # Extrahiere die Commit-Nachricht und entferne Zeilenumbrüche
          COMMIT_MESSAGE=$(git log -1 --pretty=%B | tr -d '\n' | sed 's/"/\\"/g')
          echo "COMMIT_MESSAGE=${COMMIT_MESSAGE}"
          echo "COMMIT_MESSAGE=${COMMIT_MESSAGE}" >> $GITHUB_ENV

      - name: Determine if this is a draft release (SNAPSHOT version)
        id: check_snapshot
        run: |
          if [[ "${VERSION}" == *"SNAPSHOT"* ]]; then
            echo "IS_DRAFT=true"
          else
            echo "IS_DRAFT=false"
          fi
          echo "IS_DRAFT=${IS_DRAFT}" >> $GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          release_name: v${{ env.VERSION }}
          body: ${{ env.COMMIT_MESSAGE }}
          draft: ${{ env.IS_DRAFT }}
          prerelease: ${{ env.IS_DRAFT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Jar to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/libs/common-util-${{ env.VERSION }}.jar
          asset_name: common-util-${{ env.VERSION }}.jar
          asset_content_type: application/java-archive
