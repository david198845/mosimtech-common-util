name: Build and Publish

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Create release directory
        run: mkdir -p release

      - name: Copy JAR to release directory
        run: cp build/libs/*.jar release/
      - name: Changelog
        uses: scottbrenner/generate-changelog-action@master
        id: Changelog
        env:
          REPO: ${{ github.repository }}
      - name: Generate versions
        uses: HardNorth/github-version-generate@v1.4.0
        with:
          version-source: file
          version-file: ./build.gradle.kts
          version-file-extraction-pattern: '(?<=version=).+'

      - name: Create Release
        id: create_release
        uses: "ergebnis/.github/actions/github/release/create@1.8.0"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token

      - name: Upload JAR to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ env.RELEASE_UPLOAD_URL }}
          asset_path: build/libs/common-util-${{ env.RELEASE_VERSION }}.jar
          asset_name: common-util-${{ env.RELEASE_VERSION }}.jar
          asset_content_type: application/java-archive
