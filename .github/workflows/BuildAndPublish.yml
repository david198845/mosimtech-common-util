name: Build and Publish

on:
  push:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Create release directory
        run: mkdir -p release

      - name: Copy JAR to release directory
        run: cp build/libs/*.jar release/

      - name: Set Release Version
        id: get-version
        run: echo "::set-output name=VERSION::$(grep version build.gradle | head -1 | awk -F= '{print $2}' | tr -d ' ')"

      - name: Create Release
        id: create_release
        uses: comnoco/create-release-action@v2.0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: '${{ steps.get-version.outputs.VERSION }}'
          release_name: Release ${{ steps.get_tag.outputs.tag }}
          ref: ${{ github.head_ref }}
          body: |
            Changes in this Release
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false

      - name: Upload JAR to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/libs/*.jar
          asset_name: common-util-${{ steps.get-version.outputs.VERSION }}.jar
          asset_content_type: application/java-archive
