name: Build and Publish

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Create release directory
        run: mkdir -p release

      - name: Copy JAR to release directory
        run: cp build/libs/*.jar release/
      - name: Changelog
        uses: scottbrenner/generate-changelog-action@master
        id: Changelog
        env:
          REPO: ${{ github.repository }}
      - name: Set Release Version
        id: get-version
        run: echo "::set-output name=VERSION::$(grep version build.gradle | head -1 | awk -F= '{print $2}' | tr -d ' ')"

      - name: Create Release
        id: create_release
        uses: "ergebnis/.github/actions/github/release/create@1.8.0"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
      - name: Debug
        id: Debug
        run: |
          echo "${{ steps.create_release.RELEASE_UPLOAD_URL }}" 
          echo "${{ steps.create_release.RELEASE_HTML_URL}}" 
          echo "${{ steps.create_release.RELEASE_ID}}" 
          echo "${{ steps.create_release.RELEASE_TAG}}" 


      - name: Upload JAR to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.RELEASE_UPLOAD_URL }}
          asset_path: build/libs/*.jar
          asset_name: common-util-${{ steps.get-version.outputs.VERSION }}.jar
          asset_content_type: application/java-archive
