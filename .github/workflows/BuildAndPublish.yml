name: Build and Release Jar

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.0

      - name: Set up JDK 21
        uses: actions/setup-java@v4.4.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Give Gradlew execute permission
        run: chmod +x ./gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4.0.2
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Extract version from build.gradle.kts
        id: get_version
        run: |
          VERSION=$(grep "^version =" build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=${VERSION}"
          echo "::set-output name=VERSION::${VERSION}"

      - name: Get last commit message for changelog
        id: get_commit_message
        run: |
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          echo "COMMIT_MESSAGE=${COMMIT_MESSAGE}"
          echo "::set-output name=COMMIT_MESSAGE::${COMMIT_MESSAGE}"

      - name: Determine if this is a draft release (SNAPSHOT version)
        id: check_snapshot
        run: |
          if [[ "${{ steps.get_version.outputs.VERSION }}" == *"SNAPSHOT"* ]]; then
            echo "IS_DRAFT=true"
          else
            echo "IS_DRAFT=false"
          fi
          echo "::set-output name=IS_DRAFT::${IS_DRAFT}"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          release_name: ${{ steps.get_version.outputs.VERSION }}
          body: ${{ steps.get_commit_message.outputs.COMMIT_MESSAGE }}
          draft: ${{ steps.check_snapshot.outputs.IS_DRAFT }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Jar to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/libs/common-util-${{ steps.get_version.outputs.VERSION }}.jar
          asset_name: common-util-${{ steps.get_version.outputs.VERSION }}.jar
          asset_content_type: application/java-archive
